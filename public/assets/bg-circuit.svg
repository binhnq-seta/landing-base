<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#228CDB" stroke-width="1" fill="none">
    <!-- Main grid lines -->
    <line x1="80" y1="0" x2="80" y2="160" opacity="0.18"/>
    <line x1="0" y1="80" x2="160" y2="80" opacity="0.18"/>

    <!-- Circuit traces — horizontal -->
    <path d="M0 40 L40 40 L40 80" opacity="0.35"/>
    <path d="M120 80 L120 40 L160 40" opacity="0.35"/>
    <path d="M0 120 L40 120 L40 80" opacity="0.28"/>
    <path d="M120 80 L120 120 L160 120" opacity="0.28"/>

    <!-- Circuit traces — diagonal shortcuts -->
    <path d="M80 0 L80 40" opacity="0.30"/>
    <path d="M80 120 L80 160" opacity="0.30"/>

    <!-- Short stubs (bus lines) -->
    <line x1="0" y1="60" x2="20" y2="60" opacity="0.22"/>
    <line x1="140" y1="60" x2="160" y2="60" opacity="0.22"/>
    <line x1="0" y1="100" x2="20" y2="100" opacity="0.22"/>
    <line x1="140" y1="100" x2="160" y2="100" opacity="0.22"/>
    <line x1="60" y1="0" x2="60" y2="20" opacity="0.22"/>
    <line x1="100" y1="0" x2="100" y2="20" opacity="0.22"/>
    <line x1="60" y1="140" x2="60" y2="160" opacity="0.22"/>
    <line x1="100" y1="140" x2="100" y2="160" opacity="0.22"/>

    <!-- IC chip body (center) -->
    <rect x="58" y="58" width="44" height="44" rx="4" opacity="0.30" stroke-dasharray="5,3"/>

    <!-- Pads at junctions -->
    <circle cx="80" cy="80" r="5" fill="#228CDB" fill-opacity="0.40" opacity="0.90"/>
    <circle cx="40" cy="40" r="3.5" fill="#228CDB" fill-opacity="0.35"/>
    <circle cx="120" cy="40" r="3.5" fill="#228CDB" fill-opacity="0.35"/>
    <circle cx="40" cy="120" r="3.5" fill="#228CDB" fill-opacity="0.30"/>
    <circle cx="120" cy="120" r="3.5" fill="#228CDB" fill-opacity="0.30"/>
    <circle cx="40" cy="80" r="2.5" fill="#228CDB" fill-opacity="0.28"/>
    <circle cx="120" cy="80" r="2.5" fill="#228CDB" fill-opacity="0.28"/>
    <circle cx="80" cy="40" r="2.5" fill="#228CDB" fill-opacity="0.28"/>
    <circle cx="80" cy="120" r="2.5" fill="#228CDB" fill-opacity="0.28"/>

    <!-- Resistor element (top-left quadrant) -->
    <line x1="12" y1="40" x2="18" y2="40" stroke-width="1.5" opacity="0.40"/>
    <rect x="18" y="36" width="14" height="8" rx="2" opacity="0.35"/>
    <line x1="32" y1="40" x2="40" y2="40" stroke-width="1.5" opacity="0.40"/>

    <!-- Capacitor element (bottom-right) -->
    <line x1="120" y1="132" x2="120" y2="138" stroke-width="1.5" opacity="0.38"/>
    <line x1="113" y1="138" x2="127" y2="138" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
    <line x1="113" y1="143" x2="127" y2="143" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
    <line x1="120" y1="143" x2="120" y2="148" stroke-width="1.5" opacity="0.38"/>

    <!-- Corner connector dots -->
    <circle cx="0" cy="0" r="2" fill="#228CDB" fill-opacity="0.20"/>
    <circle cx="160" cy="0" r="2" fill="#228CDB" fill-opacity="0.20"/>
    <circle cx="0" cy="160" r="2" fill="#228CDB" fill-opacity="0.20"/>
    <circle cx="160" cy="160" r="2" fill="#228CDB" fill-opacity="0.20"/>
  </g>
</svg>
