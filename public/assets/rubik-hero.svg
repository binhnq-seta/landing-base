<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <defs>
    <!-- Drop shadow for depth -->
    <filter id="dropshadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000820" flood-opacity="0.55"/>
    </filter>

    <!-- Top face: lit from above — brightest -->
    <linearGradient id="topFace" gradientUnits="userSpaceOnUse" x1="200" y1="60" x2="200" y2="210">
      <stop offset="0%" stop-color="#2460e0"/>
      <stop offset="100%" stop-color="#1040b0"/>
    </linearGradient>

    <!-- Left face: partial shadow -->
    <linearGradient id="leftFace" gradientUnits="userSpaceOnUse" x1="200" y1="135" x2="70" y2="340">
      <stop offset="0%" stop-color="#0c2a80"/>
      <stop offset="100%" stop-color="#060e38"/>
    </linearGradient>

    <!-- Right face: medium light -->
    <linearGradient id="rightFace" gradientUnits="userSpaceOnUse" x1="200" y1="135" x2="330" y2="340">
      <stop offset="0%" stop-color="#1038c0"/>
      <stop offset="100%" stop-color="#081848"/>
    </linearGradient>

    <!-- Clearcoat specular — bright top-right -->
    <radialGradient id="clearcoat" gradientUnits="userSpaceOnUse" cx="305" cy="88" r="165">
      <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Face fills (with drop shadow on the whole group) ── -->
  <g filter="url(#dropshadow)">
    <!-- Top face:   A(200,60)  B(330,135) C(200,210) D(70,135) -->
    <polygon points="200,60 330,135 200,210 70,135"  fill="url(#topFace)"/>
    <!-- Left face:  D(70,135)  C(200,210) E(200,360) F(70,285) -->
    <polygon points="70,135 200,210 200,360 70,285"  fill="url(#leftFace)"/>
    <!-- Right face: C(200,210) B(330,135) G(330,285) E(200,360) -->
    <polygon points="200,210 330,135 330,285 200,360" fill="url(#rightFace)"/>
  </g>

  <!-- ── Grid lines (thick dark strokes simulate the gap between cubies) ── -->
  <!-- Top face grid
       dx = (B-A)/3 = (43.3, 25)   — step toward B
       dz = (D-A)/3 = (−43.3, 25)  — step toward D
       x=1 line: (243.3,85)→(113.4,160)   x=2 line: (286.6,110)→(156.7,185)
       z=1 line: (156.7,85)→(286.7,160)   z=2 line: (113.4,110)→(243.4,185) -->
  <g stroke="#040e30" stroke-width="3" stroke-linecap="square">
    <line x1="243.3" y1="85"  x2="113.4" y2="160"/>
    <line x1="286.6" y1="110" x2="156.7" y2="185"/>
    <line x1="156.7" y1="85"  x2="286.7" y2="160"/>
    <line x1="113.4" y1="110" x2="243.4" y2="185"/>
  </g>

  <!-- Left face grid
       d_right = (C-D)/3 = (43.3,25)   d_down = (F-D)/3 = (0,50)
       x=1: (113.3,160)→(113.3,310)   x=2: (156.6,185)→(156.6,335)
       y=1: (70,185)→(200,260)         y=2: (70,235)→(200,310) -->
  <g stroke="#020810" stroke-width="3" stroke-linecap="square">
    <line x1="113.3" y1="160" x2="113.3" y2="310"/>
    <line x1="156.6" y1="185" x2="156.6" y2="335"/>
    <line x1="70"    y1="185" x2="200"   y2="260"/>
    <line x1="70"    y1="235" x2="200"   y2="310"/>
  </g>

  <!-- Right face grid
       d_right = (B-C)/3 = (43.3,−25)  d_down = (E-C)/3 = (0,50)
       x=1: (243.3,185)→(243.3,335)   x=2: (286.6,160)→(286.6,310)
       y=1: (200,260)→(330,185)        y=2: (200,310)→(330,235) -->
  <g stroke="#020810" stroke-width="3" stroke-linecap="square">
    <line x1="243.3" y1="185" x2="243.3" y2="335"/>
    <line x1="286.6" y1="160" x2="286.6" y2="310"/>
    <line x1="200"   y1="260" x2="330"   y2="185"/>
    <line x1="200"   y1="310" x2="330"   y2="235"/>
  </g>

  <!-- ── Outer edge highlights (clearcoat edge glow) ── -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top silhouette — brightest -->
    <polygon points="200,60 330,135 200,210 70,135"
             stroke="#4070f0" stroke-width="1.5" opacity="0.75"/>
    <!-- Left face border -->
    <polygon points="70,135 200,210 200,360 70,285"
             stroke="#1e38b0" stroke-width="1.2" opacity="0.55"/>
    <!-- Right face border -->
    <polygon points="200,210 330,135 330,285 200,360"
             stroke="#1e38b0" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- ── Clearcoat specular highlight (the white sheen of MeshPhysicalMaterial) ── -->
  <polygon points="200,60 330,135 200,210 70,135" fill="url(#clearcoat)"/>
  <!-- Hot-spot micro-specular on the top-right cubie -->
  <ellipse cx="285" cy="118" rx="24" ry="10"
           fill="white" opacity="0.16" transform="rotate(-30,285,118)"/>
</svg>
